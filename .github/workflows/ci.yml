name: Suffra CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Typecheck, and Test
    runs-on: ubuntu-latest
    env:
      COMPACT_VERSION: 0.31.1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Compact Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
          "$HOME/.compact/bin/compact" update "$COMPACT_VERSION"
          "$HOME/.compact/bin/compact" compile --version

      - name: Compile Suffra Contract
        run: npm run compile

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Production Frontend
        run: npm run build
